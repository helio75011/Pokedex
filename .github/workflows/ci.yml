# Intégration continue : à chaque push sur main et à chaque pull request, GitHub vérifie le code.
# Déploiement continu : Vercel construit la nouvelle version, mais ne la met en ligne
# qu'une fois ce job réussi (réglage « Deployment Checks » du projet Vercel).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires et fonctionnels (Vitest)
        run: npm test

      - name: Build de production
        run: npm run build
