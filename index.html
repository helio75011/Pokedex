<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pokédex des 151 pokémons de la 1re génération, en français."
    />
    <!-- Couleur de la barre du navigateur sur mobile : le blanc du site -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Ouvre la connexion au serveur des images avant même que React les demande -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <!-- Polices : Bricolage Grotesque (titres et texte) et Caveat (notes manuscrites) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600&display=swap"
    />
    <title>Mon Pokédex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
